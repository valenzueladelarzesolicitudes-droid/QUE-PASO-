<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f1f8">
<title>Mi calendario</title>
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<link rel="manifest" href="./calendar.webmanifest">
<script>
  (() => {
    let preference;
    try { preference = localStorage.getItem('mi-calendario.theme'); } catch {}
    document.documentElement.dataset.theme = preference === 'dark' || preference === 'light'
      ? preference
      : window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="./calendar.css?v=3">
<link rel="stylesheet" href="./supplier-control.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <img class="brand-mark" src="./assets/logo.png" width="96" height="96" alt="">
      <h1>Mi calendario</h1>
    </div>
    <div class="header-actions">
      <button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro">
        <span class="theme-label" aria-hidden="true">Modo oscuro</span>
        <span class="theme-track" aria-hidden="true"><span class="theme-thumb" id="theme-icon">☀</span></span>
      </button>
      <button class="primary" id="add"><span aria-hidden="true">+</span> Agregar</button>
    </div>
  </div>
</header>
<main>
  <div id="sync-controls" hidden>
    <p id="sync-status" role="status"></p>
    <div id="sync-actions">
      <button id="import-local" type="button" hidden>Importar pendientes de este navegador</button>
      <button id="change-password" type="button" hidden>Cambiar contraseña</button>
      <button id="account" type="button">Iniciar sesión</button>
    </div>
  </div>
  <p id="notice" role="status" hidden></p>
  <p id="cloud-error" role="status" hidden></p>
  <p id="auth-link-error" role="status" hidden></p>
  <nav class="app-nav" aria-label="Secciones de Mi calendario">
    <button type="button" id="calendar-nav" aria-controls="calendar-view" aria-pressed="true">Calendario</button>
    <button type="button" id="suppliers-nav" aria-controls="suppliers-view" aria-pressed="false">Proveedores y facturas</button>
  </nav>
  <div class="workspace" id="calendar-view">
    <section class="panel calendar-panel" aria-labelledby="month">
      <div class="toolbar">
        <h2 id="month" class="month" aria-live="polite"></h2>
        <div class="month-controls">
          <button class="month-step" id="prev" aria-label="Mes anterior">‹</button>
          <button id="today">Hoy</button>
          <button class="month-step" id="next" aria-label="Mes siguiente">›</button>
        </div>
      </div>
      <div class="grid week" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
      <div class="grid" id="days"></div>
    </section>
    <div class="agenda-column">
      <section class="panel agenda-panel" aria-labelledby="selected">
        <div class="panel-heading"><h2 id="selected"></h2><span class="counter" id="entry-count" hidden></span></div>
        <div id="entries"></div>
      </section>
      <section class="panel agenda-panel" aria-labelledby="upcoming">
        <div class="panel-heading"><h2 id="upcoming">Próximas actividades</h2><span class="counter" id="agenda-count" hidden></span></div>
        <div id="agenda"></div>
      </section>
      <section class="panel agenda-panel completed-panel" aria-labelledby="completed-title">
        <div class="panel-heading"><h2 id="completed-title">Pendientes completados</h2><span class="counter" id="completed-count" hidden></span></div>
        <div id="completed"></div>
      </section>
    </div>
  </div>
  <section id="suppliers-view" aria-labelledby="suppliers-title" hidden>
    <header class="supplier-header">
      <h2 id="suppliers-title">Proveedores, OC y facturas</h2>
      <div class="supplier-actions" id="supplier-actions" hidden>
        <button type="button" id="supplier-import">Importar Excel</button>
        <button type="button" class="primary" id="supplier-add">+ Nuevo registro</button>
      </div>
    </header>
    <div class="panel supplier-panel" id="supplier-locked">
      <p>Inicia sesión para acceder a las órdenes de compra y facturas.</p>
      <button type="button" id="supplier-login">Iniciar sesión</button>
    </div>
    <p class="supplier-message" id="supplier-message" role="status" hidden></p>
    <div id="supplier-content" hidden>
      <div class="supplier-stats" id="supplier-stats" aria-label="Filtrar por estado"></div>
      <div class="panel supplier-panel">
        <div class="supplier-filters">
          <label>Buscar<input type="search" id="supplier-search" placeholder="Proveedor, OC o factura"></label>
          <label>Año<select id="supplier-year"></select></label>
          <label>Mes<select id="supplier-month"></select></label>
          <label>Estado<select id="supplier-status"></select></label>
        </div>
        <p class="supplier-count" id="supplier-count" aria-live="polite"></p>
        <div id="supplier-records" class="supplier-records"></div>
      </div>
    </div>
  </section>
</main>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="form">
    <h2 id="editor-title">Agregar al calendario</h2>
    <label>Título<input name="title" maxlength="120" required></label>
    <label>Fecha<input name="date" type="date" min="0001-01-01" max="9999-12-31" required></label>
    <label>Tipo<select name="type"><option value="task">Pendiente</option><option value="event">Evento</option></select></label>
    <label class="check"><input name="important" type="checkbox"> Importante</label>
    <label class="check" id="done-field"><input name="done" type="checkbox"> Completado</label>
    <p id="editor-error" role="status" hidden></p>
    <div class="actions"><button type="button" id="delete" hidden>Eliminar</button><button type="button" id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>
  </form>
</dialog>
<dialog id="auth" aria-labelledby="auth-title">
  <form id="auth-form">
    <h2 id="auth-title">Iniciar sesión</h2>
    <label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label>
    <div class="password-field">
      <label for="login-password">Contraseña</label>
      <div class="password-input">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar contraseña" aria-controls="login-password">
          <span class="password-eye" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <p id="auth-message" role="status" hidden></p>
    <div class="actions"><button type="button" id="auth-close">Cerrar</button><button class="primary" id="auth-submit">Entrar</button></div>
    <button type="button" id="send-access-link">Configurar o recuperar contraseña por correo</button>
  </form>
</dialog>
<dialog id="password-editor" aria-labelledby="password-title">
  <form id="password-form">
    <h2 id="password-title">Cambiar contraseña</h2>
    <label>Nueva contraseña (mínimo 8 caracteres)<input name="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Repite la contraseña<input name="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
    <p id="password-message" role="status" hidden></p>
    <div class="actions"><button type="button" id="password-close">Cancelar</button><button class="primary" id="password-submit">Guardar contraseña</button></div>
  </form>
</dialog>
<dialog id="supplier-editor" aria-labelledby="supplier-editor-title">
  <form id="supplier-form">
    <h2 id="supplier-editor-title">Nuevo registro</h2>
    <label>Proveedor<input name="supplier" list="supplier-names" maxlength="180" required></label>
    <datalist id="supplier-names"></datalist>
    <div class="supplier-form-grid">
      <label>Mes<select name="month" required></select></label>
      <label>Año<input name="year" type="number" min="1900" max="9999" required></label>
      <label>N.º de OC<input name="order_number" maxlength="100"></label>
      <label>N.º de factura<input name="invoice_number" maxlength="100"></label>
    </div>
    <label>Estado<select name="status"></select></label>
    <label>Fecha de recepción<input name="received_on" type="date" min="0001-01-01" max="9999-12-31"></label>
    <label>Observaciones<textarea name="notes" maxlength="2000" rows="3"></textarea></label>
    <p class="supplier-error" id="supplier-editor-error" role="status" hidden></p>
    <div class="actions">
      <button type="button" id="supplier-delete" hidden>Eliminar</button>
      <button type="button" id="supplier-cancel">Cancelar</button>
      <button type="submit" class="primary" id="supplier-save">Guardar</button>
    </div>
  </form>
</dialog>
<dialog id="supplier-import-dialog" aria-labelledby="supplier-import-title">
  <form id="supplier-import-form">
    <h2 id="supplier-import-title">Importar Excel</h2>
    <label>Planilla de control (.xlsx)<input name="workbook" type="file" accept=".xlsx" required></label>
    <p id="supplier-import-preview" role="status" hidden></p>
    <p class="supplier-error" id="supplier-import-error" role="status" hidden></p>
    <div class="actions">
      <button type="button" id="supplier-import-cancel">Cerrar</button>
      <button type="button" id="supplier-preview">Revisar archivo</button>
      <button type="submit" class="primary" id="supplier-import-submit" disabled>Importar registros</button>
    </div>
  </form>
</dialog>
<script src="./calendar-config.js"></script>
<script src="./calendar-sync.js?v=5"></script>
<script src="./supplier-control.js"></script>
<script>
const byId = id => document.getElementById(id);
const key = 'mi-calendario.v1';
const themeKey = 'mi-calendario.theme';
const themeSwitch = byId('theme-switch');
const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)');
let preferredTheme;
try { preferredTheme = localStorage.getItem(themeKey); } catch {}

function applyTheme(theme) {
  const dark = theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  themeSwitch.setAttribute('aria-checked', String(dark));
  byId('theme-icon').textContent = dark ? '☾' : '☀';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#15121c' : '#f3f1f8';
}
applyTheme(document.documentElement.dataset.theme);
themeSwitch.onclick = () => {
  preferredTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(preferredTheme);
  try { localStorage.setItem(themeKey, preferredTheme); } catch {}
};
systemTheme?.addEventListener?.('change', event => {
  if (preferredTheme !== 'dark' && preferredTheme !== 'light') applyTheme(event.matches ? 'dark' : 'light');
});
const monthFormat = new Intl.DateTimeFormat('es-CL', {month: 'long', year: 'numeric'});
const dayFormat = new Intl.DateTimeFormat('es-CL', {weekday: 'long', day: 'numeric', month: 'long'});
const fullDateFormat = new Intl.DateTimeFormat('es-CL', {dateStyle: 'full'});
function dateKey(date) {
  return [String(date.getFullYear()).padStart(4, '0'), date.getMonth() + 1, date.getDate()]
    .map(part => String(part).padStart(2, '0')).join('-');
}
function parseDate(value) { return new Date(value + 'T12:00:00'); }
function makeDate(year, month, day) {
  const date = new Date(2000, 0, 1, 12);
  date.setFullYear(year, month, day);
  return date;
}
function message(id, value) {
  const node = byId(id);
  node.textContent = value;
  node.hidden = !value;
}
let items = [];
let selected = dateKey(new Date());
let visibleMonth = parseDate(selected);
let editing = null;
const editor = byId('editor');
const form = byId('form');
let sync;
let account = null;
let stopUpdates;
let live = false;
let cloudStatus = 'loading';
let busy = false;
let loadNumber = 0;
let connecting = Boolean(window.connectCalendar);
const auth = byId('auth');
const authForm = byId('auth-form');
const passwordEditor = byId('password-editor');
const passwordForm = byId('password-form');

function accessError(error) {
  switch (error?.code) {
    case 'invalid_credentials':
      return 'El correo o la contraseña son incorrectos. Si aún no tienes contraseña, configúrala por correo.';
    case 'email_not_confirmed':
      return 'Tu correo aún debe confirmarse en Supabase.';
    case 'weak_password':
      return 'La contraseña no cumple los requisitos de Supabase. Prueba con una más larga y única.';
    case 'same_password':
      return 'Elige una contraseña distinta de la actual.';
    case 'reauthentication_needed':
      return 'Para cambiar la contraseña, cierra sesión y pide un nuevo enlace de acceso.';
    case 'email_address_invalid':
    case 'validation_failed':
      return 'Revisa que el correo esté bien escrito, incluido el dominio (por ejemplo, gmail.com).';
    case 'email_address_not_authorized':
      return 'El servicio de correo de Supabase no puede enviar enlaces a esta dirección. Usa el correo autorizado en el proyecto.';
    case 'user_not_found':
    case 'signup_disabled':
      return 'Este correo todavía no tiene acceso. Revisa que figure en Authentication → Users en Supabase.';
    case 'over_email_send_rate_limit':
    case 'over_request_rate_limit':
      return 'Supabase limitó el envío de enlaces. Espera antes de volver a intentarlo.';
    case 'otp_expired':
      return 'El enlace caducó o ya se usó. Pide un enlace nuevo en este dispositivo.';
    default:
      if (error?.status === 429) return 'Hay demasiadas solicitudes. Espera antes de pedir otro enlace.';
      if (error?.name === 'AuthRetryableFetchError') return 'No se pudo contactar a Supabase. Revisa tu conexión e inténtalo de nuevo.';
      return 'Supabase no pudo completar el acceso. Revisa Authentication → Logs en el proyecto para ver el motivo.';
  }
}

const linkParams = new URLSearchParams(location.hash.slice(1));
const queryParams = new URLSearchParams(location.search);
const linkError = linkParams.get('error_code') || queryParams.get('error_code');
if (linkError) {
  message('auth-link-error', accessError({code: linkError}));
}

function readLocal() {
  const stored = JSON.parse(localStorage.getItem(key) ?? '[]');
  if (!Array.isArray(stored)) throw new Error('Formato inválido');
  return stored;
}

function loadLocal() {
  try {
    items = readLocal();
  } catch {
    items = [];
    message('notice', 'No se pudieron cargar los datos guardados.');
  }
}

function updateSyncControls() {
  if (!window.connectCalendar) return;
  byId('sync-controls').hidden = false;
  const accountButton = byId('account');
  accountButton.disabled = connecting || !sync || busy;
  accountButton.textContent = account ? 'Cerrar sesión' : 'Iniciar sesión';
  const passwordButton = byId('change-password');
  passwordButton.hidden = !account;
  passwordButton.disabled = busy;
  let status = connecting ? 'Conectando con Supabase…' : 'Solo en este navegador';
  if (account) {
    if (cloudStatus === 'loading') status = 'Cargando calendario compartido…';
    else if (cloudStatus === 'error') status = 'Sesión iniciada. Error al cargar pendientes.';
    else status = live ? 'Calendario compartido · Sincronización en tiempo real activa' : 'Pendientes cargados. Reconectando en tiempo real…';
    status += ' · ' + account.email;
  }
  message('sync-status', status);
  const importButton = byId('import-local');
  importButton.hidden = true;
  if (account) {
    try {
      importButton.hidden = !readLocal().length;
    } catch {
      message('notice', 'No se pudieron leer los pendientes de este navegador.');
    }
  }
  importButton.disabled = busy;
}

async function reloadCloud() {
  if (!account) return;
  const userId = account.id;
  const request = ++loadNumber;
  try {
    const data = await sync.read();
    if (request !== loadNumber || account?.id !== userId) return;
    items = data;
    cloudStatus = 'ready';
    message('cloud-error', '');
    render();
  } catch {
    if (request === loadNumber && account?.id === userId) {
      cloudStatus = 'error';
      updateSyncControls();
      message('cloud-error', 'No se pudieron cargar tus pendientes desde Supabase. Se volverá a intentar.');
    }
  }
}

async function changeSession(user) {
  const starting = connecting;
  connecting = false;
  if (!starting && user?.id === account?.id) {
    updateSyncControls();
    return;
  }
  ++loadNumber;
  stopUpdates?.();
  stopUpdates = undefined;
  account = user;
  live = false;
  cloudStatus = 'loading';
  if (user) message('auth-link-error', '');
  if (editor.open) editor.close();
  if (auth.open) auth.close();
  if (passwordEditor.open) passwordEditor.close();
  message('notice', '');
  message('cloud-error', '');
  items = [];
  if (!user) loadLocal();
  render();
  window.supplierControl?.setSession(user?.id, sync?.suppliers);
  if (!user) return;

  reloadCloud();
  try {
    const close = await sync.subscribe(reloadCloud, status => {
      if (account?.id !== user.id) return;
      live = status === 'SUBSCRIBED';
      updateSyncControls();
      if (live) reloadCloud();
    });
    if (account?.id === user.id) stopUpdates = close;
    else close();
  } catch {
    if (account?.id === user.id) {
      message('cloud-error', 'La conexión en tiempo real falló. El calendario se seguirá actualizando periódicamente.');
    }
  }
}

async function mutate(operation, id, values, onDone) {
  if (busy || connecting) return;
  const userId = account?.id;
  const target = editor.open ? 'editor-error' : 'notice';
  busy = true;
  updateSyncControls();
  byId('save').disabled = true;
  byId('delete').disabled = true;
  try {
    if (userId) {
      if (operation === 'remove') {
        await sync.remove(id);
      } else {
        values = operation === 'insert'
          ? await sync.insert({id, ...values})
          : await sync.update(id, values);
      }
      if (account?.id !== userId) return;
      ++loadNumber;
    } else {
      items = readLocal();
    }
    const previous = items.find(item => item.id === id);
    if (!userId && operation === 'update' && !previous) {
      throw new Error('La actividad ya no existe.');
    }
    const next = items.filter(item => item.id !== id);
    if (operation !== 'remove') next.push({...previous, id, ...values});
    if (!userId) localStorage.setItem(key, JSON.stringify(next));
    items = next;
    message(target, '');
    onDone?.();
  } catch {
    if (account?.id === userId) {
      message(target, userId
        ? 'No se pudo guardar el cambio en Supabase. Vuelve a intentarlo.'
        : 'No se pudo guardar el cambio en este navegador.');
    }
  } finally {
    busy = false;
    byId('save').disabled = false;
    byId('delete').disabled = false;
    updateSyncControls();
    render();
    if (userId && account?.id === userId) reloadCloud();
  }
}
function button(label, act) {
  const node = document.createElement('button');
  node.type = 'button';
  node.textContent = label;
  node.addEventListener('click', act);
  return node;
}
function renderList(id, records, empty, showDate) {
  const list = byId(id);
  list.replaceChildren();
  if (!records.length) {
    const text = document.createElement('p');
    text.className = 'empty-state';
    text.textContent = empty;
    list.append(text);
  }
  for (const item of records) {
    const row = document.createElement('div');
    row.className = item.done ? 'entry done' : 'entry';
    const details = document.createElement('div');
    const title = document.createElement('strong');
    title.textContent = item.title;
    const meta = document.createElement('small');
    meta.textContent = [showDate && fullDateFormat.format(parseDate(item.date)),
      item.type === 'event' ? 'Evento' : item.done ? 'Completado' : 'Pendiente',
      item.important && 'Importante'].filter(Boolean).join(' · ');
    details.append(title, meta);
    row.append(details);
    if (item.type === 'task') {
      const toggle = button(item.done ? '↶' : '✓', () => mutate('update', item.id, {done: !item.done}));
      toggle.className = 'complete-task';
      toggle.title = item.done ? 'Reabrir pendiente' : 'Marcar como completado';
      toggle.setAttribute('aria-label', (item.done ? 'Reabrir ' : 'Completar ') + item.title);
      row.append(toggle);
    }
    const edit = button('Editar', () => openEditor(item));
    edit.setAttribute('aria-label', 'Editar ' + item.title);
    row.append(edit);
    list.append(row);
  }
}
function countLabel(id, count) {
  message(id, count ? String(count) : '');
  byId(id).setAttribute('aria-label', count === 1 ? '1 actividad' : count + ' actividades');
}

function calendarDay(date, records) {
  const value = dateKey(date);
  const day = button('', () => { selected = value; render(true); });
  day.className = records.length ? 'day has-items' : 'day';
  day.dataset.date = value;
  day.setAttribute('aria-label', fullDateFormat.format(date)
    + (records.length === 1 ? ', 1 actividad' : records.length ? ', ' + records.length + ' actividades' : ''));
  day.setAttribute('aria-pressed', String(value === selected));
  day.tabIndex = value === selected ? 0 : -1;

  const number = document.createElement('span');
  number.className = 'day-number';
  number.textContent = date.getDate();
  day.append(number);
  if (records.length) {
    const preview = document.createElement('span');
    preview.className = 'day-preview';
    preview.setAttribute('aria-hidden', 'true');
    for (const item of records.slice(0, 2)) {
      const chip = document.createElement('span');
      chip.className = ['day-chip', item.type, item.important && 'important', item.done && 'done'].filter(Boolean).join(' ');
      chip.textContent = item.title;
      preview.append(chip);
    }
    if (records.length > 2) {
      const more = document.createElement('span');
      more.className = 'day-more';
      more.textContent = '+' + (records.length - 2);
      preview.append(more);
    }
    day.append(preview);
  }
  return day;
}

function capitalize(text) {
  return text.charAt(0).toLocaleUpperCase('es-CL') + text.slice(1);
}

function render(focusDay = false) {
  updateSyncControls();
  byId('add').disabled = connecting;
  const now = dateKey(new Date());
  byId('month').textContent = capitalize(monthFormat.format(visibleMonth));
  const year = visibleMonth.getFullYear();
  const month = visibleMonth.getMonth();
  byId('prev').disabled = year === 1 && month === 0;
  byId('next').disabled = year === 9999 && month === 11;
  const first = makeDate(year, month, 1);
  const count = makeDate(year, month + 1, 0).getDate();
  const days = byId('days');
  const focusDate = focusDay ? selected : days.contains(document.activeElement) ? document.activeElement.dataset.date : '';
  days.replaceChildren();
  const byDate = new Map();
  for (const item of items) {
    if (!byDate.has(item.date)) byDate.set(item.date, []);
    byDate.get(item.date).push(item);
  }
  const leading = (first.getDay() + 6) % 7;
  const trailing = (7 - (leading + count) % 7) % 7;
  for (let index = 0; index < leading + count + trailing; index++) {
    if (index < leading || index >= leading + count) {
      const blank = document.createElement('span');
      blank.className = 'calendar-blank';
      blank.setAttribute('aria-hidden', 'true');
      days.append(blank);
      continue;
    }
    const date = makeDate(year, month, index - leading + 1);
    const value = dateKey(date);
    const day = calendarDay(date, byDate.get(value) ?? []);
    if (value === now) day.setAttribute('aria-current', 'date');
    days.append(day);
    if (value === focusDate) day.focus();
  }
  byId('selected').textContent = capitalize(dayFormat.format(parseDate(selected)));
  const selectedItems = (byDate.get(selected) ?? []).filter(item => !item.done);
  countLabel('entry-count', selectedItems.length);
  renderList('entries', selectedItems, 'Sin pendientes ni eventos para este día.', false);
  const upcoming = items.filter(item => !item.done && item.date >= now)
    .sort((a, b) => a.date.localeCompare(b.date) || Number(b.important) - Number(a.important));
  countLabel('agenda-count', upcoming.length);
  renderList('agenda', upcoming, 'Sin próximos pendientes ni eventos.', true);
  const completed = items.filter(item => item.type === 'task' && item.done)
    .sort((a, b) => b.date.localeCompare(a.date));
  countLabel('completed-count', completed.length);
  renderList('completed', completed, 'Todavía no hay pendientes completados.', true);
}

const dayOffsets = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7};
byId('days').addEventListener('keydown', event => {
  const day = event.target.closest('[data-date]');
  if (!day || !Object.hasOwn(dayOffsets, event.key) || event.altKey || event.ctrlKey || event.metaKey) return;
  event.preventDefault();
  const date = parseDate(day.dataset.date);
  const next = makeDate(date.getFullYear(), date.getMonth(), date.getDate() + dayOffsets[event.key]);
  if (next.getFullYear() < 1 || next.getFullYear() > 9999) return;
  selected = dateKey(next);
  visibleMonth = next;
  render(true);
});

function navigate(year, month) {
  visibleMonth = makeDate(year, month, 1);
  selected = dateKey(visibleMonth);
  render();
}
function updateDoneField() {
  byId('done-field').hidden = form.elements.type.value !== 'task';
}

function openEditor(item = null) {
  if (connecting || busy) return;
  editing = item;
  form.reset();
  form.elements.title.value = item?.title ?? '';
  form.elements.date.value = item?.date ?? selected;
  form.elements.type.value = item?.type ?? 'task';
  form.elements.important.checked = item?.important ?? false;
  form.elements.done.checked = item?.done ?? false;
  updateDoneField();
  byId('editor-title').textContent = item ? 'Editar actividad' : 'Agregar al calendario';
  byId('delete').hidden = !item;
  message('editor-error', '');
  editor.showModal();
  form.elements.title.focus();
}
byId('add').onclick = () => openEditor();
byId('prev').onclick = () => navigate(visibleMonth.getFullYear(), visibleMonth.getMonth() - 1);
byId('next').onclick = () => navigate(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1);
byId('today').onclick = () => { visibleMonth = new Date(); selected = dateKey(visibleMonth); render(); };
byId('cancel').onclick = () => editor.close();
form.elements.type.addEventListener('change', updateDoneField);
byId('delete').onclick = () => {
  if (editing && confirm('¿Eliminar esta actividad?')) {
    mutate('remove', editing.id, null, () => editor.close());
  }
};
form.addEventListener('submit', event => {
  event.preventDefault();
  const title = form.elements.title.value.trim();
  if (!title) { message('editor-error', 'Escribe un título.'); form.elements.title.focus(); return; }
  const type = form.elements.type.value;
  const id = editing?.id ?? (globalThis.crypto?.randomUUID?.() ?? Date.now() + '-' + Math.random());
  const values = {title, date: form.elements.date.value, type, important: form.elements.important.checked};
  const done = type === 'task' && form.elements.done.checked;
  if (!editing || type === 'event' || done !== Boolean(editing.done)) values.done = done;
  mutate(editing ? 'update' : 'insert', id, values, () => {
    selected = values.date;
    visibleMonth = parseDate(selected);
    editor.close();
  });
});

byId('account').onclick = async () => {
  if (account) {
    try {
      await sync.signOut();
    } catch {
      message('notice', 'No se pudo cerrar sesión. Vuelve a intentarlo.');
    }
    return;
  }
  message('auth-link-error', '');
  message('auth-message', '');
  auth.showModal();
};
byId('auth-close').onclick = () => auth.close();
const loginPassword = byId('login-password');
const passwordToggle = byId('toggle-password');

function showLoginPassword(visible) {
  loginPassword.type = visible ? 'text' : 'password';
  passwordToggle.toggleAttribute('data-visible', visible);
  passwordToggle.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
}

passwordToggle.onclick = () => showLoginPassword(loginPassword.type === 'password');
auth.addEventListener('close', () => {
  loginPassword.value = '';
  showLoginPassword(false);
});

async function submitAccess(operation) {
  const submit = byId('auth-submit');
  const link = byId('send-access-link');
  submit.disabled = true;
  link.disabled = true;
  message('auth-message', '');
  try {
    await operation();
  } catch (error) {
    message('auth-message', accessError(error));
  } finally {
    submit.disabled = false;
    link.disabled = false;
  }
}

authForm.addEventListener('submit', event => {
  event.preventDefault();
  const {email, password} = authForm.elements;
  submitAccess(() => sync.signIn(email.value.trim(), password.value));
});
byId('send-access-link').onclick = () => {
  const email = authForm.elements.email;
  if (!email.reportValidity()) return;
  submitAccess(async () => {
    await sync.sendAccessLink(email.value.trim());
    message('auth-message', 'Abre el enlace en este navegador. Luego pulsa Cambiar contraseña en el calendario.');
  });
};

byId('change-password').onclick = () => {
  if (!account) return;
  passwordForm.reset();
  message('password-message', '');
  passwordEditor.showModal();
};
byId('password-close').onclick = () => passwordEditor.close();
passwordEditor.addEventListener('close', () => passwordForm.reset());
passwordForm.addEventListener('submit', async event => {
  event.preventDefault();
  const userId = account?.id;
  if (!userId) return;
  const {newPassword, confirmation} = passwordForm.elements;
  if (newPassword.value !== confirmation.value) {
    message('password-message', 'Las dos contraseñas deben ser iguales.');
    confirmation.focus();
    return;
  }
  const submit = byId('password-submit');
  submit.disabled = true;
  message('password-message', '');
  try {
    await sync.updatePassword(newPassword.value);
    if (account?.id !== userId) return;
    passwordEditor.close();
    message('notice', 'Contraseña guardada. Ya puedes usarla para entrar desde el otro dispositivo.');
  } catch (error) {
    if (account?.id === userId) message('password-message', accessError(error));
  } finally {
    submit.disabled = false;
  }
});
byId('import-local').onclick = async () => {
  if (!account || busy || !confirm('¿Copiar los pendientes de este navegador al calendario compartido?')) return;
  const userId = account.id;
  busy = true;
  updateSyncControls();
  try {
    const local = readLocal();
    await sync.import(local);
    if (account?.id !== userId) return;
    const imported = new Map(local.map(item => [item.id, JSON.stringify(item)]));
    const remaining = readLocal().filter(item => imported.get(item.id) !== JSON.stringify(item));
    localStorage.setItem(key, JSON.stringify(remaining));
    message('notice', 'Se importaron los pendientes de este navegador.');
  } catch {
    if (account?.id === userId) message('notice', 'No se pudo terminar la importación. Puedes volver a intentarlo.');
  } finally {
    busy = false;
    updateSyncControls();
    reloadCloud();
  }
};

window.addEventListener('storage', event => {
  if (event.key === themeKey || event.key === null) {
    preferredTheme = event.newValue;
    const fallback = systemTheme?.matches ? 'dark' : 'light';
    applyTheme(preferredTheme === 'dark' || preferredTheme === 'light' ? preferredTheme : fallback);
  }
  if (event.key !== key && event.key !== null) return;
  if (!account) {
    loadLocal();
    render();
  } else {
    updateSyncControls();
  }
});
window.addEventListener('online', reloadCloud);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) reloadCloud();
});
if (window.connectCalendar) {
  window.connectCalendar().then(connection => {
    sync = connection;
    // Supabase auth callbacks must return before using other client methods.
    sync.onSession(session => setTimeout(() => changeSession(session?.user ?? null), 0));
    setInterval(() => { if (!document.hidden) reloadCloud(); }, 60000);
  }).catch(() => {
    connecting = false;
    message('notice', 'No se pudo conectar a Supabase. Puedes seguir usando el calendario en este navegador.');
    loadLocal();
    render();
  });
} else {
  loadLocal();
}
render();
</script>
</body>
</html>
